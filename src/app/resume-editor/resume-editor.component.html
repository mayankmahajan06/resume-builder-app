<div class="editor-shell">

  <!-- TOP BAR -->
  <header class="editor-header">
    <div class="header-left">
      <h2>Resume Editor</h2>
      <span class="hint">Start with your basic details</span>
    </div>

    <div class="header-actions">
      <button mat-stroked-button color="primary" (click)="saveDraft()">
        Save Draft
      </button>
      <button mat-raised-button color="primary" (click)="downloadPdf()">
        Download PDF
      </button>
    </div>
  </header>

  <!-- BODY -->
  <div class="editor-body">

    <!-- LEFT: FORM -->
    <section class="editor-form" [formGroup]="resumeForm">

      <!-- PERSONAL INFO -->
      <div class="form-section" formGroupName="personal">
        <h3>Personal Information</h3>

        <mat-form-field appearance="outline">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="fullName" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Professional Title</mat-label>
          <input matInput formControlName="title" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Phone</mat-label>
          <input matInput formControlName="phone" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Location</mat-label>
          <input matInput formControlName="location" />
        </mat-form-field>
      </div>

      <!-- SUMMARY -->
      <div class="form-section">
        <h3>Professional Summary</h3>
        <mat-form-field appearance="outline" class="full">
          <textarea matInput rows="3" formControlName="summary"></textarea>
        </mat-form-field>
      </div>

      <mat-divider class="section-divider"></mat-divider>

      <!-- SKILLS -->
      <div class="form-section">
        <h3>Skills</h3>
        <mat-form-field appearance="outline" class="full">
          <textarea matInput rows="3" formControlName="skills"></textarea>
        </mat-form-field>
      </div>

      <mat-divider class="section-divider"></mat-divider>

      <!-- EXPERIENCE -->
      <div class="form-section experience-section" formArrayName="experience">

        <div class="experience-header">
          <h3>Experience</h3>
          <button
            mat-stroked-button
            color="primary"
            type="button"
            (click)="addExperience()"
          >
            + Add
          </button>
        </div>

        <div
          class="experience-block"
          *ngFor="let exp of experience.controls; let i = index"
          [formGroupName]="i"
        >

          <mat-form-field appearance="outline">
            <mat-label>Role</mat-label>
            <input matInput formControlName="role" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Company</mat-label>
            <input matInput formControlName="company" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Location</mat-label>
            <input matInput formControlName="location" />
          </mat-form-field>

          <div class="date-row">
            <mat-form-field appearance="outline">
              <mat-label>Start Date</mat-label>
              <input matInput formControlName="startDate" />
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>End Date</mat-label>
              <input matInput formControlName="endDate" />
            </mat-form-field>
          </div>

          <mat-form-field appearance="outline" class="full">
            <mat-label>Description</mat-label>
            <textarea matInput rows="3" formControlName="description"></textarea>
          </mat-form-field>

          <button mat-button color="warn" class="remove-btn" (click)="removeExperience(i)">
            Remove Experience
          </button>

        </div>

      </div>

    </section>

    <!-- RIGHT: PREVIEW -->
    <section class="editor-preview">
      <app-resume-preview [data]="resumeForm.value"></app-resume-preview>
    </section>

  </div>
</div>
